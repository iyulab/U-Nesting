name: Bug report
description: Something behaves differently from what the documentation says
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        A failing test, a short program, or the exact input and output.
        This is the most useful part of the report — it removes the guessing.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "e.g. 0.10.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "OS, and toolchain/runtime version"
    validations:
      required: false
