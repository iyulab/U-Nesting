name: Python Package

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'crates/python/**'
  workflow_dispatch:
    inputs:
      publish_to:
        description: 'Publish destination'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Check if version changed
  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Verify binding versions are in lockstep
        run: bash scripts/check-version-consistency.sh

      - name: Get current version
        id: get_version
        run: |
          VERSION=$(grep -m1 'version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version changed
        id: check
        run: |
          git diff HEAD~1 HEAD -- Cargo.toml | grep -q '+version = ' && echo "changed=true" >> $GITHUB_OUTPUT || echo "changed=false" >> $GITHUB_OUTPUT

  linux:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout path dependencies
        shell: bash
        run: |
          mkdir -p ../../foundation ../../algorithms
          git clone --depth 1 https://github.com/iyulab/u-numflow.git ../../foundation/u-numflow
          git clone --depth 1 https://github.com/iyulab/u-metaheur.git ../../algorithms/u-metaheur
          git clone --depth 1 https://github.com/iyulab/u-geometry.git ../../algorithms/u-geometry
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m crates/python/Cargo.toml
          sccache: 'true'
          manylinux: auto
          # The host "Checkout path dependencies" step clones the sibling crates
          # OUTSIDE the workspace (../../foundation, ../../algorithms), which the
          # manylinux Docker container does not mount — so `cargo metadata` fails to
          # read u-geometry et al. Re-clone them INSIDE the container at the same
          # relative paths so the path dependencies resolve. Idempotent guard in
          # case the host tree happens to be visible.
          before-script-linux: |
            mkdir -p ../../foundation ../../algorithms
            [ -d ../../foundation/u-numflow ] || git clone --depth 1 https://github.com/iyulab/u-numflow.git ../../foundation/u-numflow
            [ -d ../../algorithms/u-metaheur ] || git clone --depth 1 https://github.com/iyulab/u-metaheur.git ../../algorithms/u-metaheur
            [ -d ../../algorithms/u-geometry ] || git clone --depth 1 https://github.com/iyulab/u-geometry.git ../../algorithms/u-geometry
      # Publish gate: a wheel that builds is not a wheel that imports. Install the
      # freshly built artifact and drive it, so a broken extension fails here
      # rather than on a user's first `pip install`. Restricted to the native
      # target — aarch64 wheels are cross-built in the manylinux container and
      # cannot be executed on this x86_64 runner.
      - name: Wheel smoke test
        if: matrix.target == 'x86_64'
        run: |
          pip install --no-index --find-links dist u-nesting
          python scripts/python_wheel_smoke.py
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist
          retention-days: 1

  windows:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout path dependencies
        shell: bash
        run: |
          mkdir -p ../../foundation ../../algorithms
          git clone --depth 1 https://github.com/iyulab/u-numflow.git ../../foundation/u-numflow
          git clone --depth 1 https://github.com/iyulab/u-metaheur.git ../../algorithms/u-metaheur
          git clone --depth 1 https://github.com/iyulab/u-geometry.git ../../algorithms/u-geometry
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target == 'x64' && 'x86_64-pc-windows-msvc' || 'i686-pc-windows-msvc' }}
          args: --release --out dist -m crates/python/Cargo.toml
          sccache: 'true'
      # Publish gate — see the linux job. Both matrix targets here are native to
      # the runner, so this always runs.
      - name: Wheel smoke test
        shell: bash
        run: |
          pip install --no-index --find-links dist u-nesting
          python scripts/python_wheel_smoke.py
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist
          retention-days: 1

  macos:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout path dependencies
        shell: bash
        run: |
          mkdir -p ../../foundation ../../algorithms
          git clone --depth 1 https://github.com/iyulab/u-numflow.git ../../foundation/u-numflow
          git clone --depth 1 https://github.com/iyulab/u-metaheur.git ../../algorithms/u-metaheur
          git clone --depth 1 https://github.com/iyulab/u-geometry.git ../../algorithms/u-geometry
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}-apple-darwin
          args: --release --out dist -m crates/python/Cargo.toml
          sccache: 'true'
      # Publish gate — see the linux job. `macos-latest` runners are arm64, so
      # only the aarch64 wheel is native here; the x86_64 one is cross-built.
      - name: Wheel smoke test
        if: matrix.target == 'aarch64'
        run: |
          pip install --no-index --find-links dist u-nesting
          python scripts/python_wheel_smoke.py
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist
          retention-days: 1

  # No sdist: the crate has out-of-tree path dependencies (../../foundation,
  # ../../algorithms) that maturin cannot bundle into a self-contained source
  # distribution (`cargo package --list` fails on the sibling workspaces). Wheels
  # are the published artifact; building from source requires the full umbrella repo.

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [check-version, linux, windows, macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/u-nesting
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [check-version, linux, windows, macos]
    runs-on: ubuntu-latest
    if: (needs.check-version.outputs.changed == 'true' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/p/u-nesting
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
