# Dependency version updates.
#
# Grouped and monthly on purpose: ungrouped weekly updates produce more pull
# requests than a small maintainer team reviews, and an unreviewed dependency
# pull request is worse than no automation at all.
#
# The github-actions ecosystem is the one that keeps pinned action SHAs fresh.
# A SHA pin without it is a snapshot that silently goes stale.
version: 2
updates:
  # GitHub Actions requires "/" — Dependabot reads .github/workflows from the root.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"

# NOTE — there is deliberately no `cargo` entry here.
#
# This crate declares sibling crates with a `path = "../../..."` dependency that
# resolves only when the whole family is checked out together. Dependabot clones
# this repository alone, so `cargo update` fails there:
#
#     error: failed to load source for dependency `<sibling>`
#
# (Reproduced with `cargo metadata` in a standalone clone: exit 101.) A cargo
# entry would therefore be a job that fails every month while looking like
# coverage. CI works because it clones the siblings explicitly first.
#
# Removing this limitation means replacing the path dependencies with registry
# versions plus a `[patch.crates-io]` section in the development workspace —
# a cross-repository change, tracked separately.
